server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hermes WebUI main route
    location /hermes/ {
        proxy_pass http://127.0.0.1:18787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_hide_header X-Frame-Options;
    }

    # Hermes static files (SmartStock uses /assets/, so /static/ won't conflict)
    location /static/ {
        proxy_pass http://127.0.0.1:18787/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Hermes absolute API paths — must be listed before generic /api/ → Java
    # Chat streaming (SSE)
    location /api/chat/ {
        proxy_pass http://127.0.0.1:18787/api/chat/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /api/sessions/ {
        proxy_pass http://127.0.0.1:18787/api/sessions/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/session {
        proxy_pass http://127.0.0.1:18787/api/session;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    location /api/models {
        proxy_pass http://127.0.0.1:18787/api/models;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/providers {
        proxy_pass http://127.0.0.1:18787/api/providers;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/settings {
        proxy_pass http://127.0.0.1:18787/api/settings;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/reasoning {
        proxy_pass http://127.0.0.1:18787/api/reasoning;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/auth/ {
        proxy_pass http://127.0.0.1:18787/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/onboarding {
        proxy_pass http://127.0.0.1:18787/api/onboarding;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/background {
        proxy_pass http://127.0.0.1:18787/api/background;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/projects {
        proxy_pass http://127.0.0.1:18787/api/projects;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/workspaces {
        proxy_pass http://127.0.0.1:18787/api/workspaces;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/list {
        proxy_pass http://127.0.0.1:18787/api/list;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/personalities {
        proxy_pass http://127.0.0.1:18787/api/personalities;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/git-info {
        proxy_pass http://127.0.0.1:18787/api/git-info;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/commands {
        proxy_pass http://127.0.0.1:18787/api/commands;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/updates {
        proxy_pass http://127.0.0.1:18787/api/updates;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/media {
        proxy_pass http://127.0.0.1:18787/api/media;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/file {
        proxy_pass http://127.0.0.1:18787/api/file;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/approval {
        proxy_pass http://127.0.0.1:18787/api/approval;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/clarify {
        proxy_pass http://127.0.0.1:18787/api/clarify;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /manifest.json {
        proxy_pass http://127.0.0.1:18787/manifest.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SmartStock API → Java backend (must be after Hermes API paths)
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
