spring:
  application:
    name: ${SMARTSTOCK_APP_NAME:smartstock-ai}

  datasource:
    url: ${SMARTSTOCK_DB_URL:jdbc:mysql://127.0.0.1:3306/smartstock_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${SMARTSTOCK_DB_USERNAME:root}
    password: ${SMARTSTOCK_DB_PASSWORD:}
    driver-class-name: ${SMARTSTOCK_DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: ${SMARTSTOCK_DB_MAX_POOL_SIZE:20}
      minimum-idle: ${SMARTSTOCK_DB_MIN_IDLE:5}
      connection-timeout: ${SMARTSTOCK_DB_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${SMARTSTOCK_DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${SMARTSTOCK_DB_MAX_LIFETIME:1800000}

  data:
    redis:
      host: ${SMARTSTOCK_REDIS_HOST:127.0.0.1}
      port: ${SMARTSTOCK_REDIS_PORT:6379}
      password: ${SMARTSTOCK_REDIS_PASSWORD:}
      database: ${SMARTSTOCK_REDIS_DATABASE:0}
      timeout: ${SMARTSTOCK_REDIS_TIMEOUT:5000ms}
      lettuce:
        pool:
          max-active: ${SMARTSTOCK_REDIS_MAX_ACTIVE:8}
          max-idle: ${SMARTSTOCK_REDIS_MAX_IDLE:8}
          min-idle: ${SMARTSTOCK_REDIS_MIN_IDLE:0}

  cache:
    type: caffeine

server:
  port: ${SMARTSTOCK_SERVER_PORT:8080}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.smartstock.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

eastmoney:
  base-url: ${SMARTSTOCK_EASTMONEY_BASE_URL:http://push2.eastmoney.com}
  his-url: ${SMARTSTOCK_EASTMONEY_HIS_URL:http://push2his.eastmoney.com}
  search-url: ${SMARTSTOCK_EASTMONEY_SEARCH_URL:http://searchapi.eastmoney.com}

jwt:
  secret: ${SMARTSTOCK_JWT_SECRET:smartstock-ai-dev-secret-key-change-in-production-2026}
  expiration-seconds: ${SMARTSTOCK_JWT_EXPIRATION_SECONDS:604800}

smartstock:
  analysis:
    base-url: ${SMARTSTOCK_ANALYSIS_BASE_URL:http://146.190.49.37:8000}
    timeout: ${SMARTSTOCK_ANALYSIS_TIMEOUT:180s}
  gemini:
    base-url: ${SMARTSTOCK_GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    api-key: ${SMARTSTOCK_GEMINI_API_KEY:}
    model: ${SMARTSTOCK_GEMINI_MODEL:gemini-3-pro-preview}
    timeout: ${SMARTSTOCK_GEMINI_TIMEOUT:120s}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

resilience4j:
  retry:
    instances:
      remoteSource:
        max-attempts: 3
        wait-duration: 300ms
        retry-exceptions:
          - java.lang.Exception
  circuitbreaker:
    instances:
      remoteSource:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 5
        failure-rate-threshold: 60
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 10s
  ratelimiter:
    instances:
      remoteSource:
        limit-for-period: 40
        limit-refresh-period: 1s
        timeout-duration: 0
  bulkhead:
    instances:
      remoteSource:
        max-concurrent-calls: 16
        max-wait-duration: 0
